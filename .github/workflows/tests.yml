name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: pipeline (${{ matrix.libs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        libs: [current, legacy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # Fabric Python notebooks' default kernel
      - name: Install
        run: |
          if [ "${{ matrix.libs }}" = "legacy" ]; then
            pip install -r requirements-legacy.txt
          else
            pip install -r requirements.txt
          fi
      - name: Validate config files
        run: python scripts/deploy_to_onelake.py --local "$RUNNER_TEMP/onelake" --data sample --data dirty
      - name: Run the notebooks end to end (local)
        run: python -m pytest -q tests
