name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: pipeline (${{ matrix.os }}, ${{ matrix.libs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, libs: current}
          - {os: ubuntu-latest, libs: legacy}
          - {os: windows-latest, libs: current}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # Fabric Python notebooks' default kernel
      - name: Install
        run: |
          if [ "${{ matrix.libs }}" = "legacy" ]; then
            pip install -r requirements-legacy.txt
          else
            pip install -r requirements.txt
          fi
          pip install --no-deps -e .
      - name: Notebooks are up to date with src/
        run: python scripts/build_notebooks.py --check
      - name: Validate config files
        run: python scripts/deploy_to_onelake.py --local "$RUNNER_TEMP/onelake" --data sample --data dirty
      - name: Run the pipeline with the medallion command
        run: |
          medallion init "$RUNNER_TEMP/lakehouses" --data sample
          medallion run all --root "$RUNNER_TEMP/lakehouses" --quiet
      - name: Tests (notebooks and engine, end to end)
        run: python -m pytest -q
